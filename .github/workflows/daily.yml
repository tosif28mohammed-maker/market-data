name: daily-market-data
on:
  schedule:
    - cron: '30 11 * * 1-5'   # 11:30 UTC = 5:00 PM India, Monday-Friday (after market close)
  workflow_dispatch: {}        # also a "Run workflow" button for manual runs
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas
      - run: PYTHONPATH=scripts python scripts/fetch.py
      - run: python scripts/gapday.py || echo 'gapday failed'
      - run: pip install requests && python scripts/fii_dii.py || echo 'fii failed'
      - run: python scripts/corp_actions.py || echo 'corp failed'
      - run: python paper/engine.py
      - run: python scripts/mom_paper.py || echo 'mom failed'
      - run: python scripts/breadth_paper.py || echo 'breadth failed'
      - run: python scripts/tips_tracker.py || echo 'tips failed'
      - run: python scripts/div_paper.py || echo 'div paper failed'
      - run: python scripts/tf_scan.py || echo 'tf scan failed'
      - run: python scripts/daily_checklist.py || echo 'checklist failed'
      - run: pip install requests && python scripts/deliv_daily.py || echo 'delivery failed'
      - run: pip install requests && python scripts/decision.py || echo 'decision failed'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data paper
          git commit -m "data $(date -u +%Y-%m-%d)" || echo "no change"
          git pull --rebase || true
          git push
