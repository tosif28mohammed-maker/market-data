name: corp
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas numpy
      - run: python scripts/corp_actions.py
      - run: |
          git config user.name "market-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/corp; git commit -m "corp $(date -u +%Y-%m-%d_%H%M)" || true; git pull --rebase || true; git push
