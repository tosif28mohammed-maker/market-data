name: idea-factory
# user 9 Nov 2026: robot khud har hafte naye idea soche aur sakhti se jaanche (study/idea_factory.py). Free GitHub robot.
on:
  schedule:
    - cron: '17 4 * * 6'   # Saturday ~9:47 IST, market band
  workflow_dispatch:
    inputs:
      n: { description: 'new ideas this run', default: '150' }
permissions:
  contents: write
concurrency: { group: ideas, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: universe500, path: u500, sparse-checkout: "u1000\nu2000" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python study/idea_factory.py
        env: { U500: "${{ github.workspace }}/u500", NI_CACHE: "/tmp/ni_panel.pkl", IDEAS_N: "${{ github.event.inputs.n || '150' }}", PYTHONUNBUFFERED: '1' }
      - if: always()
        run: |
          git config user.name "market-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add study/results/idea_ledger.csv data/ideas.md && git commit -qm "idea factory run" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 7; done
