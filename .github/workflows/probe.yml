name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q requests
          python - <<'PY'
          import requests, time, json, re
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept':'*/*'})
          for u in ['https://archives.nseindia.com/content/historical/DERIVATIVES/2015/JAN/fo05JAN2015bhav.csv.zip','https://archives.nseindia.com/content/historical/DERIVATIVES/2023/JAN/fo05JAN2023bhav.csv.zip']:
              try: r=S.get(u,timeout=20); print('FO',r.status_code,len(r.content),u)
              except Exception as e: print('ERR',type(e).__name__,u)
          h=S.get('https://www.niftyindices.com/reports/historical-data',timeout=20).text
          print('ENDP',sorted(set(re.findall(r'[A-Za-z/._-]*(?:aspx/|/api/)[A-Za-z0-9_/.-]+',h)))[:40])
          for js in sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"',h))):
              try:
                  t=S.get(js if js.startswith('http') else 'https://www.niftyindices.com'+js,timeout=20).text
                  f=sorted(set(re.findall(r'[A-Za-z/._-]*(?:aspx/|/api/|Backpage)[A-Za-z0-9_/.-]*',t)))
                  if f: print('JS',js,f[:40])
              except Exception as e: print('jserr',js,e)
          PY
