name: ai_keytest
on:
  push:
    paths: ['scripts/ai_keytest.py', '.github/workflows/ai_keytest.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/ai_keytest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study/ai/keytest.txt
          git commit -m "AI key test result" || echo "no change"
          git pull --rebase || true
          git push
