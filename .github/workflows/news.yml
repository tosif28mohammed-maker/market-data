name: news
on:
  schedule:
    - cron: '20 0 * * *'    # 5:50 AM India, every day (before market; after US close)
    - cron: '40 10 * * 1-5' # 4:10 PM India, weekdays (after market close)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/fetch_news.py
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news
          git commit -m "news $(date -u +%Y-%m-%d_%H%M)" || echo "no change"
          git pull --rebase || true
          git push
