name: mausam-study
on:
  workflow_dispatch:
    inputs:
      note: { description: 'note', default: 'run' }
permissions:
  contents: write
concurrency: { group: mausam, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: universe500, path: u500, sparse-checkout: "u1000\nu2000" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python study/weather.py fetch
      - run: python study/weather.py study
        env: { U500: "${{ github.workspace }}/u500", NI_CACHE: "/tmp/ni_panel.pkl", PYTHONUNBUFFERED: '1' }
      - if: always()
        run: |
          git config user.name "market-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/weather study/results/weather* && git commit -qm "weather study" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 7; done
