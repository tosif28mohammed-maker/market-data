name: add-symbols
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'NSE codes, comma separated (e.g. IRCTC, ZYDUSLIFE, BANKNIFTY)'
        required: true
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas
      - run: PYTHONPATH=scripts python scripts/add_symbols.py "${{ github.event.inputs.symbols }}"
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data symbols_extra.txt
          git commit -m "add symbols: ${{ github.event.inputs.symbols }}" || echo "no change"
          git pull --rebase || true
          git push
