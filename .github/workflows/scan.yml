name: scan-data
on:
  schedule:
    - cron: '45 10 * * 1-5'   # 4:15 PM India
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas
      - run: python scripts/fetch_daily_all.py
      - run: |
          git config user.name "market-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/daily_all; git commit -m "daily_all $(date -u +%Y-%m-%d_%H%M)" || true; git pull --rebase || true; git push
