name: macro_data
on:
  schedule:
    - cron: '25 13 * * 1-5'   # 6:55 PM IST (after NSE index file)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: macro_data, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: World Bank + FRED macro (GDP, mcap/GDP, CPI, 10y G-sec, USDINR, IIP)
        continue-on-error: true
        run: python scripts/macro_history.py
      - name: NSE index P/E P/B DivYield history (resumable)
        continue-on-error: true
        env: { MAX_MIN: '38' }
        run: python scripts/index_pe_history.py
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro data/indices
          git commit -m "macro data $(date -u +%Y-%m-%d_%H%M)" || echo "no change"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
