name: tf
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas numpy
      - run: python scripts/tf_scan.py
      - run: python scripts/daily_checklist.py
      - run: |
          git config user.name "market-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/tf_scan.csv data/tf_zone.csv data/checklist.md; git commit -m "tf $(date -u +%Y-%m-%d_%H%M)" || true; git pull --rebase || true; git push
