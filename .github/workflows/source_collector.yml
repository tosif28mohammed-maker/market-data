name: source_collector
on:
  schedule:
    - cron: '40 0 * * *'    # 6:10 AM IST
    - cron: '10 7 * * *'    # 12:40 PM IST
    - cron: '40 12 * * *'   # 6:10 PM IST
    - cron: '10 17 * * *'   # 10:40 PM IST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: source_collector, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q youtube-transcript-api && sudo apt-get install -y -q poppler-utils >/dev/null
      - run: python scripts/source_collector.py
      - name: book finder (Gutenberg public-domain classics, arXiv papers, official free reports)
        timeout-minutes: 15
        continue-on-error: true
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: python scripts/book_finder.py || echo "book finder failed - next run"
      - name: claim test scripts (study/research/claims/*.py, if any)
        env: { U500: '/home/runner/u500', NI_CACHE: '/home/runner/ni_panel.pkl' }
        run: |
          pip install -q pandas numpy
          need=0; for f in study/research/claims/*.py; do grep -q "^# ROBOT" "$f" || continue; out="${f%.py}.out.txt"; [ -f "$out" ] && [ "$out" -nt "$f" ] && continue; need=1; done
          if [ "$need" = 1 ] && [ ! -d /home/runner/u500 ]; then git clone -q --depth 1 --filter=blob:none --sparse --branch universe500 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /home/runner/u500 && (cd /home/runner/u500 && git sparse-checkout set u1000/daily u2000/daily) || echo "u500 clone failed"; fi
          for f in study/research/claims/*.py; do [ -f "$f" ] || continue; grep -q "^# ROBOT" "$f" || continue; out="${f%.py}.out.txt"; [ -f "$out" ] && [ "$out" -nt "$f" ] && continue; timeout 900 python "$f" > "$out" 2>&1 || echo "fail $f" >> "$out"; done
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study/experts study/research/claims study/ai 2>/dev/null || git add study/experts
          git commit -m "sources $(date -u +%Y-%m-%d_%H%M)" || echo "no change"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && break; sleep 5; done
