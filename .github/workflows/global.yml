name: global-markets
on:
  schedule:
    - cron: '45 0 * * 2-6'   # 00:45 UTC Tue-Sat = after the US close, before India opens (6:15 AM IST)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python scripts/fetch_global.py
      - run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/global
          git commit -m "global $(date -u +%Y-%m-%d)" || echo none
          git pull --rebase origin main && git push origin main
